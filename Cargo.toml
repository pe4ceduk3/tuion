[package]
name = "tui_outliner"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30.2"
ratatui-wgpu = "0.6.0"
wgpu = "30.0.2"
winit = { version = "0.30.13", features = ["android-native-activity"] }
pollster = "1.0.3"
bevy_ecs = "0.20.1"
bevy_app = "0.20.1"
bevy_time = "0.20.1"
dirs = "7.0.0"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "std",
] }
tui-textarea-2 = { version = "0.14.0", default-features = false, features = [
  "ratatui",
] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
# будильники и прочее
jni = "0.22.4"
ndk-context = "0.1.1"

# fuzzy-ранжирование путей
nucleo = "0.5.0"
# обход дерева: .gitignore, скрытые, параллельно
ignore = "0.4.34"

# включить, когда появится поиск по содержимому файлов:
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"

#font-kit = "0.14.3"
#tui_calendar, CalendarEventStore, Monthly
#edtui инпут поле с vim раскладкой
#tui_prompts диалоговые окна

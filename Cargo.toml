[package]
name = "tui_outliner"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30.2"
ratatui-wgpu = "0.6.0"
wgpu = "30.0.2"
winit = { version = "0.30.13", features = ["android-native-activity"] }
pollster = "1.0.1"
bevy_ecs = "0.20.1"
bevy_app = "0.20.1"
bevy_time = "0.20.1"
dirs = "7.0.0"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "std",
] }
tui-textarea-2 = { version = "0.14.0", default-features = false, features = [
  "ratatui",
] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
jni = "0.22.4"
ndk-context = "0.1.1"

